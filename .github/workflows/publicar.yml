name: Atualizar dados e publicar

# Desligado até escolhermos a hospedagem: o GitHub Pages grátis não funciona
# com repositório privado. Para religar, volte o `schedule` (03:17 de Brasília):
#   schedule:
#     - cron: "17 6 * * *"
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Downloads grandes (TSE, emendas, CEAP) ficam em cache entre execuções.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: dados-${{ github.run_id }}
          restore-keys: dados-

      - name: Coletar dados oficiais
        run: npm run dados

      - name: Gerar site estático
        run: npm run build
        env:
          # No GitHub Pages sem domínio próprio o site fica em /<repo>.
          # Com domínio próprio, crie a variável de repositório BASE_PATH="/".
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
