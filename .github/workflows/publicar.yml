name: Atualizar dados e publicar

# Todo dia: coleta Câmara, Senado e emendas (o TSE vem de dados-base/tse/),
# confere os resultados e, se não houver erro, publica na Vercel.
# Precisa dos segredos VERCEL_TOKEN, VERCEL_ORG_ID e VERCEL_PROJECT_ID (veja o README).
on:
  schedule:
    - cron: "17 6 * * *" # 03:17 de Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Conferir segredos da Vercel
        run: |
          for s in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!s}" ]; then echo "::error::Falta o segredo $s (Settings → Secrets and variables → Actions)"; exit 1; fi
          done

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: publicar-${{ github.run_id }}
          restore-keys: |
            publicar-
            coleta-

      - name: Coletar dados oficiais
        run: |
          set -o pipefail
          npm run dados 2>&1 | tee coleta.log

      - name: Conferir resultados (erro aqui impede a publicação)
        run: |
          npx tsx pipeline/relatorio.ts relatorio.md || STATUS=$?
          cat relatorio.md >> "$GITHUB_STEP_SUMMARY"
          exit ${STATUS:-0}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: publicar-${{ github.run_id }}

      - name: Publicar na Vercel
        run: |
          set -o pipefail
          npx --yes vercel@62 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@62 build --prod --token="$VERCEL_TOKEN"
          # --archive=tgz envia um pacote só: o plano grátis limita a 5.000 arquivos enviados por dia.
          npx --yes vercel@62 deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN" | tee deploy.txt
          echo "Publicado: $(tail -1 deploy.txt)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publicacao
          retention-days: 7
          if-no-files-found: ignore
          path: |
            coleta.log
            relatorio.md
